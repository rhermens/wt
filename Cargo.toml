log = "0.4.29"
mlua = { version = "0.11.6", features = ["lua55", "vendored", "serde"] }
serde = { version = "1.0.228", features = ["derive"] }
symlink-rs = "1.0.0"
thiserror = "2.0.18"
tmux_interface = "0.4.0"
